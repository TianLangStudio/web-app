[workspace]
members = ["rboot", "tl-jwt", "tl-config", "tl-log", "tl-task", "user-center"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { features=["macros"], version = "0.8.9" }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
config = "0.15"
chrono = "0.4.45"
chrono-tz = "0.10.4"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
sea-orm = { version = "2.0.0-rc", features = [ "sqlx-sqlite", "runtime-tokio-rustls", "macros" ] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "postgres"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio-cron-scheduler = "0.15.1"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4"] }

