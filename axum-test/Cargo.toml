[package]
name = "axum-test"
version = "0.1.0"
edition = "2021"


[dependencies]
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "postgres"] }
tokio = {version = "1.48", features = ["full"]}
serde = { version = "1.0", features = ["derive"] }
rboot = {path = "../rboot"}
