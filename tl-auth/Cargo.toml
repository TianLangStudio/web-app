[package]
name = "tl-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { features=["macros"], version = "0.8.8" }
chrono = "0.4.43"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
rboot={path = "../rboot"}
sea-orm = {version = "2.0.0-rc.21", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"]}
tokio = { features=["full"], version = "1.49.0" }
serde = { version = "1.0.228", features = ["derive"] }

p256     = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
pem-rfc7468 = "1.0.0"
rand_core = "0.10.0-rc-3"
anyhow = "1.0.100"
# axum-jwt-auth = "0.6.2"
serde_json = "1.0.149"
axum-extra = { version = "0.12.5", features = ["typed-header"] }
headers = "0.4.1"
